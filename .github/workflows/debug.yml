name: Debug build

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/debug.yml'
  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    name: Linux Debug build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # The product builds this module with the official Go 1.27.4 toolchain. The go
          # directive in go.mod is a minimum language version, not the compiler used for
          # release builds, so pin the shipping toolchain here: with `^1.24` the job never
          # compiled the build-tagged Go 1.26/1.27 code paths in quic-go that the product
          # actually runs.
          go-version: '1.27.4'
      - name: Toolchain
        run: go version
      - name: Build
        run: |-
          make test
  build_minimum_go:
    name: Linux Debug build (minimum Go version)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
        continue-on-error: true
      - name: Toolchain
        run: go version
      - name: Build
        run: |-
          make test
  build__windows:
    name: Windows Debug build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
        continue-on-error: true
      - name: Toolchain
        run: go version
      - name: Build
        run: |-
          make test
  build_darwin:
    name: macOS Debug build
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
        continue-on-error: true
      - name: Toolchain
        run: go version
      - name: Build
        run: |-
          make test
